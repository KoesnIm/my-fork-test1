<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 - 바이브 코딩 실습</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Consolas', monospace;
      color: #e2e8f0;
    }

    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    #gameCanvas {
      border: 2px solid #334155;
      background: #0f172a;
      display: block;
    }

    .side-panel {
      width: 150px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }

    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .panel-box .value {
      font-size: 28px;
      font-weight: bold;
      color: #e2e8f0;
    }

    #overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      font-size: 24px;
      color: #f1f5f9;
    }

    #overlay.show { display: flex; }

    #restartBtn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Consolas', monospace;
    }
    #restartBtn:hover { background: #2563eb; }

    .canvas-wrapper {
      position: relative;
    }

    .controls {
      font-size: 12px;
      color: #475569;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>점수</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>레벨</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>라인</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>
    <div class="panel-box controls">
      <h3>조작법</h3>
      ← → 이동<br>
      ↑ 회전<br>
      ↓ 빠르게<br>
    </div>
  </div>
</div>

<script>
// ============================================================
//  ■ 상수 정의
// ============================================================
const COLS       = 10;
const ROWS       = 20;
const BLOCK_SIZE = 30;

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1],
      [1, 1]],
  T: [[0, 1, 0],
      [1, 1, 1]],
  S: [[0, 1, 1],
      [1, 1, 0]],
  Z: [[1, 1, 0],
      [0, 1, 1]],
  L: [[1, 0],
      [1, 0],
      [1, 1]],
  J: [[0, 1],
      [0, 1],
      [1, 1]],
};

const COLORS = {
  I: '#00f0f0',
  O: '#f0f000',
  T: '#a000f0',
  S: '#00f000',
  Z: '#f00000',
  L: '#f0a000',
  J: '#0000f0',
};

const PIECE_TYPES = Object.keys(SHAPES); // ['I','O','T','S','Z','L','J']

// ============================================================
//  ■ 캔버스 초기화
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ============================================================
//  ■ 게임 상태 변수
// ============================================================
let board        = [];
let currentPiece = null;
let score        = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let lastTime     = 0;
let dropInterval = 1000;

// ============================================================
//  ■ 단일 블록 그리기 헬퍼
// ============================================================
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(
    x * BLOCK_SIZE,
    y * BLOCK_SIZE,
    BLOCK_SIZE - 1,
    BLOCK_SIZE - 1
  );
  // 윗면 하이라이트 (밝게)
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 4);
}

// ============================================================
//  ■ initBoard() — ROWS×COLS 2D 배열을 null로 초기화
// ============================================================
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    // 각 행을 null로 채운 배열로 추가
    board.push(new Array(COLS).fill(null));
  }
}

// ============================================================
//  ■ createPiece() — 랜덤 블록 생성 후 보드 중앙 상단에 배치
// ============================================================
function createPiece() {
  // PIECE_TYPES 중 랜덤으로 블록 종류 선택
  const type  = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  const shape = SHAPES[type];

  // x는 보드 중앙, y는 최상단(0)에서 시작
  const x = Math.floor((COLS - shape[0].length) / 2);

  currentPiece = {
    shape: shape,
    color: COLORS[type],
    x: x,
    y: 0,
  };
}

// ============================================================
//  ■ isCollision(piece, dx, dy) — 벽·바닥·기존 블록 충돌 검사
// ============================================================
function isCollision(piece, dx, dy) {
  for (let row = 0; row < piece.shape.length; row++) {
    for (let col = 0; col < piece.shape[row].length; col++) {
      // 블록이 없는 칸은 건너뜀
      if (!piece.shape[row][col]) continue;

      // 이동 후 실제 보드 좌표 계산
      const nx = piece.x + col + dx;
      const ny = piece.y + row + dy;

      // ① 왼쪽·오른쪽 벽 충돌
      if (nx < 0 || nx >= COLS) return true;

      // ② 바닥 충돌
      if (ny >= ROWS) return true;

      // ③ 이미 고정된 블록과 충돌 (ny < 0이면 보드 위라 스킵)
      if (ny >= 0 && board[ny][nx] !== null) return true;
    }
  }
  return false; // 충돌 없음
}

// ============================================================
//  ■ rotate(shape) — 90도 시계 방향 회전 배열 반환
// ============================================================
function rotate(shape) {
  const rows = shape.length;
  const cols = shape[0].length;

  // 회전 후 크기는 cols × rows (가로·세로 뒤바뀜)
  const rotated = Array.from({ length: cols }, () => new Array(rows).fill(0));

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // 90도 시계 방향 공식: rotated[c][rows-1-r] = shape[r][c]
      rotated[c][rows - 1 - r] = shape[r][c];
    }
  }

  return rotated;
}

// ============================================================
//  ■ placePiece() — currentPiece를 board에 색상 문자열로 고정
// ============================================================
function placePiece() {
  for (let row = 0; row < currentPiece.shape.length; row++) {
    for (let col = 0; col < currentPiece.shape[row].length; col++) {
      // 값이 1인 칸만 보드에 기록
      if (currentPiece.shape[row][col]) {
        const bx = currentPiece.x + col;
        const by = currentPiece.y + row;
        board[by][bx] = currentPiece.color;
      }
    }
  }
}

// ============================================================
//  ■ clearLines() — 가득 찬 행 제거 후 점수·레벨·속도 갱신
// ============================================================
function clearLines() {
  // 점수 테이블 (동시 제거 줄 수별)
  const points = [0, 100, 300, 500, 800];

  // 가득 찬 행 수 계산
  const cleared = board.filter(row => row.every(cell => cell !== null)).length;

  if (cleared === 0) return; // 제거할 줄 없으면 종료

  // 가득 차지 않은 행만 유지
  board = board.filter(row => !row.every(cell => cell !== null));

  // 제거된 줄 수만큼 맨 위에 빈 행 추가
  for (let i = 0; i < cleared; i++) {
    board.unshift(new Array(COLS).fill(null));
  }

  // 점수 누적
  score += points[cleared] * level;

  // 클리어 라인 수·레벨·하강 속도 갱신
  linesCleared += cleared;
  level         = Math.floor(linesCleared / 10) + 1;
  dropInterval  = Math.max(100, 1000 - (level - 1) * 100);
}

// ============================================================
//  ■ draw() — 매 프레임 보드·현재 블록을 캔버스에 렌더링
// ============================================================
function draw() {
  // ① 배경 지우기
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자 선 (옅게)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth   = 0.5;
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(canvas.width, r * BLOCK_SIZE);
    ctx.stroke();
  }

  // ② board에 고정된 블록 그리기
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) {
        // null이 아닌 칸만 해당 색상으로 그리기
        drawBlock(c, r, board[r][c]);
      }
    }
  }

  // ③ 현재 낙하 중인 블록 그리기
  if (currentPiece) {
    for (let row = 0; row < currentPiece.shape.length; row++) {
      for (let col = 0; col < currentPiece.shape[row].length; col++) {
        // 값이 1인 칸만 그리기
        if (currentPiece.shape[row][col]) {
          drawBlock(
            currentPiece.x + col,
            currentPiece.y + row,
            currentPiece.color
          );
        }
      }
    }
  }
}

// ============================================================
//  ■ 키보드 입력 처리
// ============================================================
document.addEventListener('keydown', (e) => {
  if (gameOver)      return;
  if (!currentPiece) return;

  switch (e.key) {
    case 'ArrowLeft':
      // 왼쪽 충돌 없으면 x를 1 감소
      if (!isCollision(currentPiece, -1, 0)) {
        currentPiece.x -= 1;
      }
      break;

    case 'ArrowRight':
      // 오른쪽 충돌 없으면 x를 1 증가
      if (!isCollision(currentPiece, 1, 0)) {
        currentPiece.x += 1;
      }
      break;

    case 'ArrowDown':
      // 아래 충돌 없으면 y를 1 증가 (빠른 하강)
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
      } else {
        // 바닥 또는 블록에 닿으면 고정 처리
        placePiece();
        clearLines();
        createPiece();
        updateUI();

        // 새 블록 생성 즉시 충돌 = 게임 오버
        if (isCollision(currentPiece, 0, 0)) {
          gameOver = true;
          showGameOver();
        }
      }
      break;

    case 'ArrowUp': {
      // 90도 시계 방향 회전 후 충돌 검사
      const prevShape    = currentPiece.shape;
      const rotatedShape = rotate(currentPiece.shape);

      // 회전 shape 임시 적용 후 충돌 여부 확인
      currentPiece.shape = rotatedShape;
      if (isCollision(currentPiece, 0, 0)) {
        // 충돌 발생 → 원래 shape으로 복원
        currentPiece.shape = prevShape;
      }
      break;
    }
  }

  draw(); // 입력 후 즉시 화면 갱신
});

// ============================================================
//  ■ gameLoop(timestamp) — requestAnimationFrame 기반 메인 루프
// ============================================================
function gameLoop(timestamp) {
  if (gameOver) return; // 게임 오버 시 루프 종료

  // 경과 시간 계산
  const deltaTime = timestamp - lastTime;

  // dropInterval마다 블록 자동 하강
  if (deltaTime > dropInterval) {
    if (!isCollision(currentPiece, 0, 1)) {
      // 아래 공간 있으면 1칸 하강
      currentPiece.y += 1;
    } else {
      // 바닥 또는 블록에 닿으면 고정 처리
      placePiece();
      clearLines();
      createPiece();
      updateUI();

      // 새 블록 생성 즉시 충돌 = 게임 오버
      if (isCollision(currentPiece, 0, 0)) {
        gameOver = true;
        showGameOver();
        return; // 루프 즉시 종료
      }
    }

    lastTime = timestamp; // 타이머 리셋
  }

  draw();                          // 매 프레임 화면 갱신
  requestAnimationFrame(gameLoop); // 다음 프레임 예약
}

// ============================================================
//  ■ UI 업데이트 헬퍼
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('linesDisplay').textContent = linesCleared;
}

// ============================================================
//  ■ 게임 시작 / 재시작
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  dropInterval = 1000;
  lastTime     = 0;

  createPiece();
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(gameLoop);
}

document.getElementById('restartBtn').addEventListener('click', startGame);

function showGameOver() {
  document.getElementById('overlay').classList.add('show');
}

// 게임 시작!
startGame();
</script>
</body>
</html>
